name: Publish Docker Image

on:
  release:
    types:
      - published
  workflow_dispatch:
  # Every merge to master is published once its tests pass; Fleet then rolls out the new tag.
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: 'Build and publish Docker image'
    # Hosted runner on purpose: this repository is public, and the organization's self-hosted
    # runner groups serve private repositories only.
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the commit the tests passed on, not whatever master points to by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # checking out a sha leaves a detached HEAD, from which docker/metadata-action's git context
      # cannot infer a ref; a local branch at the same commit gives it one (a release is on a tag)
      - name: Attach HEAD to its branch
        if: github.event_name != 'release'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: git checkout -B "$BRANCH"

      - name: Set version
        run: |
          (git describe --tags --exact-match \
            || git symbolic-ref -q --short HEAD \
            || git rev-parse --short HEAD) > version.txt 2> /dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # - name: Login to DockerHub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # tags (sha) follow the checked-out commit, also for workflow_run
          context: git
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            latest
            alpine
            type=raw,value={{date 'YYYYMMDDHHmmss'}}
            type=sha
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
